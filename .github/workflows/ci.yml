name: CI
on:
  pull_request:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 17
            distribution: temurin
            jobtype: 1
          - os: ubuntu-latest
            java: 8
            distribution: temurin
            jobtype: 1
          # - os: ubuntu-latest
          #   java: 17
          #   distribution: temurin
          #   jobtype: 2
          # - os: ubuntu-latest
          #   java: 8
          #   distribution: temurin
          #   jobtype: 2
          # - os: ubuntu-latest
          #   java: 17
          #   distribution: temurin
          #   jobtype: 3
    runs-on: ${{ matrix.os }}
    env:
      JAVA_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms800M -Xmx2G -Xss6M -XX:ReservedCodeCacheSize=128M -server -Dsbt.io.virtual=false -Dfile.encoding=UTF-8
      JDK11: adopt@1.11.0-9
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: "${{ matrix.distribution }}"
        java-version: "${{ matrix.java }}"
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Bazel cache
      uses: actions/cache@v3
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-${{ hashFiles('.bazelrc', '.bazeliskrc', 'WORKSPACE', 'WORKSPACE.bazel', 'MODULE.bazel') }}
    - name: Build and test (1)
      if: ${{ matrix.jobtype == 1 }}
      shell: bash
      run: |
        find **/src/main/contraband-scala -name "*.scala" -delete
        sbt -v generateContrabands +test
        git diff --exit-code # check contrabands diff
    - name: Build and test (2)
      if: ${{ matrix.jobtype == 2 }}
      shell: bash
      run: bazel test ...
    - name: Build and test (3)
      if: ${{ matrix.jobtype == 3 }}
      shell: bash
      run: |
        ./bazelenv scala_2.13
        bazel test ...
        bin/scalafix ... --check
  scalafmt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: jrouly/scalafmt-native-action@v4
